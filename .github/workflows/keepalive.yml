name: Keep scheduled workflows alive

on:
  schedule:
    # 毎週月曜 12:17 JST (UTC 3:17)。他の定期実行と時刻をずらす
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Commit when the repository has been idle for 50 days
        run: |
          set -euo pipefail
          threshold_days=50
          last_epoch="$(git log -1 --format=%ct)"
          now_epoch="$(date +%s)"
          age_days="$(( (now_epoch - last_epoch) / 86400 ))"
          echo "Days since last commit: ${age_days}"
          if (( age_days < threshold_days )); then
            echo "Last commit is within ${threshold_days} days. No keepalive commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows alive"
          git push origin HEAD
